<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>今日の訪問 (見本)</title>
<link rel="stylesheet" href="../cpos-ui.css">
<script src="../cpos-ui.js" defer></script>
</head><body>
<!-- 見本 1: 最初の画面。決め 13 (行き先は 5 つまで・いまいる所が分かる) / 14 (右上に自分とログアウト) /
     9 (状態は色 + 文字) / 3 (検索は即時) / 11 (0 件は理由 + 次の一手) -->
<header class="cpos-appbar">
  <h1>訪問記録</h1>
  <details class="cpos-facility"><summary title="事業所を切り替える"><span class="cpos-sr">事業所: </span>さくら訪問介護</summary>
    <div class="cpos-facility-list">
      <a href="?facilityId=fac_sakura" aria-current="true">さくら訪問介護</a>
      <a href="?facilityId=fac_momiji">もみじデイサービス</a>
    </div></details>
  <details class="cpos-usermenu">
    <summary>山田 花子</summary>
    <div class="cpos-usermenu-list">
      <a href="/me">自分の情報</a>
      <a href="/settings">設定</a>
      <hr>
      <a href="/logout">ログアウト</a>
    </div>
  </details>
</header>

<nav class="cpos-nav" aria-label="行き先">
  <a href="today.html" aria-current="page"><span class="cpos-nav-icon" aria-hidden="true">●</span>今日</a>
  <a href="users.html"><span class="cpos-nav-icon" aria-hidden="true">≡</span>利用者</a>
  <a href="record.html"><span class="cpos-nav-icon" aria-hidden="true">✎</span>記録</a>
  <a href="#"><span class="cpos-nav-icon" aria-hidden="true">♡</span>お知らせ</a>
</nav>

<main class="cpos-page">
  <form class="cpos-search" method="get"><label class="cpos-sr" for="q">利用者を探す</label>
    <input id="q" name="q" placeholder="氏名・ふりがなで探す" autocomplete="off"></form>
  <div class="cpos-chips">
    <button class="cpos-chip" type="button" aria-pressed="true">未記録</button>
    <button class="cpos-chip" type="button" aria-pressed="false">午前</button>
    <button class="cpos-chip" type="button" aria-pressed="false">午後</button>
  </div>

  <div class="cpos-card">
    <table class="cpos-table">
      <thead><tr><th>時刻</th><th>利用者</th><th>状態</th><th></th></tr></thead>
      <tbody>
        <tr>
          <td data-label="時刻">09:00</td>
          <td data-label="利用者">佐藤 一郎 <span class="cpos-sub">要介護2</span></td>
          <td data-label="状態"><span class="cpos-badge warn">未記録</span></td>
          <td data-label=""><a class="cpos-btn primary" href="record.html">記録を書く</a></td>
        </tr>
        <tr>
          <td data-label="時刻">10:30</td>
          <td data-label="利用者">鈴木 花 <span class="cpos-sub">要介護3</span></td>
          <td data-label="状態"><span class="cpos-badge ok">済</span></td>
          <td data-label=""><a class="cpos-btn" href="record.html">記録を見る</a></td>
        </tr>
        <tr>
          <td data-label="時刻">13:00</td>
          <td data-label="利用者">高橋 清 <span class="cpos-sub">要支援2</span></td>
          <td data-label="状態"><span class="cpos-badge danger">要確認</span></td>
          <td data-label=""><a class="cpos-btn" href="user.html">利用者を見る</a></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="cpos-card">
    <h2>午後の予定</h2>
    <div class="cpos-empty">
      <p>15 時以降の訪問はありません。</p>
      <a class="cpos-btn" href="#">予定を追加</a>
    </div>
  </div>
</main>
</body></html>

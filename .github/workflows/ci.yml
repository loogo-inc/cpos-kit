name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm test
      - name: 雛形から生成して通ることを確かめる
        run: |
          node kit/bin/cpos-kit.mjs create ../smoke --name smoke --app-id smoke --sample node --yes --kit-dep "git+file://$GITHUB_WORKSPACE"
          cd ../smoke && npm install && npm test
